import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id "architectury-plugin" version "3.4.164"
    id "dev.architectury.loom" version "1.9-SNAPSHOT"
    id "org.jetbrains.kotlin.jvm" version "2.2.21"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

architectury {
    minecraft = project.minecraft_version
    platformSetupLoomIde()
    neoForge {
        platformPackage = "neoforge"
    }
}

loom {
    silentMojangMappingsLicense()
    mods {
        main {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    developmentNeoForge
}

repositories {
    mavenCentral()
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url "https://thedarkcolour.github.io/KotlinForForge/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${project.neo_forge_version}"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    runtimeOnly files("libs/kotlinforforge-${project.kotlin_for_forge_version}-all.jar")

    compileOnly files("libs/hexcasting-neoforge-${project.minecraft_version}-${project.hexcasting_version}.jar")
    compileOnly files("libs/sable-neoforge-${project.minecraft_version}-${project.sable_version}.jar")
    compileOnly files("libs/sable-companion-common-${project.minecraft_version}-1.6.0.jar")
    compileOnly files("libs/moreiotas-0.1.1+1.21.1-neoforge-pre39.jar")
    compileOnly files("libs/hexal-0.3.1+1.21.1-neoforge.jar")
    compileOnly files("libs/ejml-core-0.45.1.jar")
    compileOnly files("libs/ejml-ddense-0.45.1.jar")
    compileOnly files("libs/ejml-simple-0.45.1.jar")
    runtimeOnly files("libs/hexcasting-neoforge-${project.minecraft_version}-${project.hexcasting_version}.jar")
    runtimeOnly files("libs/sable-neoforge-${project.minecraft_version}-${project.sable_version}.jar")
    runtimeOnly files("libs/sable-companion-common-${project.minecraft_version}-1.6.0.jar")
    runtimeOnly files("libs/moreiotas-0.1.1+1.21.1-neoforge-pre39.jar")

    // These client-side production jars contain mixins and must pass through
    // Loom's mod dependency remapper before they are loaded by a dev run.
    modRuntimeOnly files("libs/inline-neoforge-1.21.1-1.2.2.jar")
    modRuntimeOnly files("libs/cloth-config-15.0.140-neoforge.jar")

    testCompileOnly "org.junit.jupiter:junit-jupiter-api:5.11.4"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
    testImplementation "org.joml:joml:1.10.8"
}

configurations {
    pureTestRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    pureTestRuntime "org.junit.jupiter:junit-jupiter-engine:5.11.4"
    pureTestRuntime "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.21"
}

sourceSets.main.kotlin.srcDirs += "src/main/java"

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.withType(KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // These are pure JVM contract tests; resolving Loom's full mod runtime here
    // would unnecessarily bootstrap Minecraft and all runtime-only loader jars.
    classpath = sourceSets.main.output + sourceSets.test.output + configurations.testCompileClasspath + configurations.pureTestRuntime
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.named("sourcesJar", Jar) {
    exclude "META-INF/neoforge.mods.toml"
}
